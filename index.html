<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⭐️星之卡比的每日天氣蛋糕</title>
    <link rel="icon" type="image/png" href="./icon-v2.png">
    <link rel="apple-touch-icon" href="./icon-v2.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-v2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --pk-sky: #ffd6e8;
            --pk-sky-soft: #ffe9f2;
            --pk-leaf: #ffb3c6;          /* 主粉紅 */
            --pk-leaf-dark: #ff6b9e;     /* 濃一點的粉紅 */
            --pk-soil: #f5a6c6;
            --pk-cream: #fff8f0;
            --pk-yellow: #ffe066;
            --pk-red: #ff6b6b;
            --pk-blue: #6ea8ff;
            --pk-purple: #c4a5ff;
            --pk-text-main: #54324a;
            --pk-text-soft: #9b6b82;
            --pk-card-border: #ffdbe8;
        }

        * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            min-height: 100vh;
            color: var(--pk-text-main);
            overflow-x: hidden;
            padding-bottom: 20px;
            background:
                radial-gradient(circle at 0 0, rgba(255, 255, 255, 0.9) 0, rgba(255, 255, 255, 0) 55%),
                radial-gradient(circle at 100% 0, rgba(255, 255, 255, 0.8) 0, rgba(255, 255, 255, 0) 55%),
                linear-gradient(to bottom, var(--pk-sky) 0%, var(--pk-sky-soft) 45%, #f5f3e8 70%, #f0e4d2 100%);
            position: relative;
        }

        /* 頂部狀態列：像探險 HUD */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin: 10px auto 0;
            max-width: 640px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            box-shadow:
                0 8px 16px rgba(0, 0, 0, 0.12),
                0 0 0 2px rgba(255, 255, 255, 0.9);
            position: sticky;
            top: 8px;
            z-index: 100;
        }

        .location-pill {
            background: linear-gradient(135deg, var(--pk-leaf), var(--pk-leaf-dark));
            color: white;
            padding: 6px 16px;
            border-radius: 999px;
            font-weight: 900;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow:
                0 3px 0 rgba(0, 0, 0, 0.18),
                0 0 0 2px rgba(255, 255, 255, 0.9);
        }

        .location-pill::before {
            content: "";
            transform: translateY(1px);
        }

        .update-pill {
            font-size: 0.8rem;
            color: var(--pk-text-soft);
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 10px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px dashed rgba(135, 142, 155, 0.4);
        }

        .update-pill::before {
            content: "⏱️";
        }

        .container {
            padding: 18px 20px 32px;
            max-width: 640px;
            margin: 0 auto;
        }

        /* === 皮克敏改卡比：今日探險主卡 === */
        .hero-card {
            background: var(--pk-cream);
            border-radius: 28px;
            padding: 24px 20px 20px;
            text-align: center;
            box-shadow:
                0 14px 24px rgba(0, 0, 0, 0.12),
                0 0 0 3px rgba(255, 255, 255, 0.9);
            border: 2px dashed var(--pk-card-border);
            margin-bottom: 18px;
            position: relative;
            overflow: visible;
        }

        .hero-card::before {
            content: "⭐️ ⭐️ ⭐️";
            position: absolute;
            bottom: 8px;
            right: 16px;
            font-size: 1.1rem;
            opacity: 0.25;
        }

        .hero-period {
            position: absolute;
            top: -12px;
            left: 16px;
            background: linear-gradient(135deg, var(--pk-yellow), #ffd46b);
            color: #64461e;
            padding: 4px 14px;
            border-radius: 999px;
            font-weight: 900;
            font-size: 0.9rem;
            border: 2px solid #fff7d6;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
        }

        .hero-temp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 10px 0 8px;
        }

        .hero-icon {
            font-size: 4.4rem;
            filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.1));
            animation: bounce 3s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-9px);
            }
        }

        .hero-temp {
            font-size: 4rem;
            font-weight: 900;
            color: var(--pk-text-main);
            line-height: 1;
            letter-spacing: -2px;
        }

        .hero-desc {
            font-size: 1.3rem;
            color: var(--pk-text-soft);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .hero-meta-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--pk-text-soft);
            margin-bottom: 10px;
        }

        .hero-meta-chip {
            padding: 3px 9px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px dashed rgba(182, 170, 148, 0.7);
        }

        /* 快速建議區：兩格 */
        .advice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .advice-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 8px;
            border-radius: 18px;
            border: 1px solid rgba(234, 221, 200, 0.9);
        }

        .advice-icon {
            font-size: 1.6rem;
            margin-bottom: 3px;
        }

        .advice-text {
            font-size: 1rem;
            font-weight: 900;
            color: var(--pk-text-main);
            margin: 2px 0 3px;
            line-height: 1.2;
        }

        .advice-sub {
            font-size: 0.7rem;
            color: var(--pk-text-soft);
        }

        /* AI 體感＆穿搭區塊 */
        .ai-advice-card {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 18px;
            background: linear-gradient(
                135deg,
                rgba(139, 226, 138, 0.2),
                rgba(125, 211, 252, 0.15)
            );
            border: 1px solid rgba(163, 209, 173, 0.9);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            position: relative;
            
            /* ⭐ 新增這一行，讓文字都靠左 */
            text-align: left;
        }

        .ai-advice-title {
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--pk-leaf-dark);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 2px;
        }

        .ai-advice-title::before {
            content: "✨";
        }

        .ai-advice-feel {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--pk-text-main);
        }

        .ai-advice-detail,
        .ai-advice-outfit,
        .ai-advice-tip {
            font-size: 0.8rem;
            color: var(--pk-text-soft);
        }

        .ai-advice-tip::before {
            content: "🔍 ";
        }

        /* 標題共用樣式（你原本的 section-title 可沿用） */
        .section-title {
            font-size: 1.1rem;
            color: var(--pk-text-main);
            margin-bottom: 0;          /* ⭐ 上面這排已經是 header，不需要再壓下方 */
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .section-title::before {
            content: "🍭";
        }

        /* 上方：左邊「接下來的天氣預報」，右邊「卡比小語」 */
        .forecast-header-row {
            display: flex;
            gap: 16px;                /* 和 .forecast-wrapper 一樣的 gap */
            margin: 18px 6px 6px;     /* 左右 6px，和下方卡片對齊 */
            align-items: flex-end;    /* 讓兩個標題底線對齊，看起來比較順 */
        }

        /* 每一側標題各佔一欄，寬度和下面卡片一致 */
        .forecast-header-col {
            flex: 1;
        }

        /* header 列裡的標題，本身不要額外 margin */
        .forecast-header-row .section-title {
            margin: 0;
        }

        /* 卡比那一側的標題蛋糕 icon（如果你現在是 .kirby-title 就用這個） */
        .kirby-title::before {
            content: "🍰";
        }

        /* 稍後預報：橫向滑動卡片 */
        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .mini-card {
            min-width: 128px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 14px 10px 12px;
            text-align: center;
            border: 1px solid rgba(233, 222, 206, 0.9);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .mini-card::after {
            content: "⭐️";
            position: absolute;
            bottom: 4px;
            right: 8px;
            font-size: 0.9rem;
            opacity: 0.25;
        }

        .mini-time {
            background: rgba(139, 226, 138, 0.2);
            color: var(--pk-leaf-dark);
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            display: inline-block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .mini-icon {
            font-size: 2.1rem;
            margin: 2px 0 3px;
        }

        .mini-temp {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--pk-text-main);
        }

        .mini-extra {
            font-size: 0.75rem;
            color: var(--pk-text-soft);
            margin-top: 3px;
        }

        /* 今日應援小隊（卡比風） */
        .squad-card {
            margin-top: 12px;
            padding: 9px 11px;
            border-radius: 18px;
            background: linear-gradient(
                135deg,
                rgba(255, 214, 232, 0.85),
                rgba(255, 240, 250, 0.95)
            );
            border: 1px solid rgba(255, 179, 209, 0.9);
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.08);
            text-align: left;  /* 標題靠左 */
        }

        .squad-title {
            font-size: 0.85rem;
            font-weight: 900;
            color: #b04a7c;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .squad-title::before {
            content: "⭐️";
        }

        .squad-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
            justify-content: flex-start;
        }

        .squad-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 9px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.95);
            font-size: 0.8rem;
            color: #5c3450;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.06);
        }

        .squad-chip-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .squad-chip-label {
            font-weight: 900;
            font-size: 0.8rem;
        }

        .squad-chip-role {
            font-size: 0.7rem;
            color: #9b6b82;  /* 比本體再淡一點的文字顏色 */
        }

        .squad-chip-icon {
            font-size: 1rem;
        }

        /* 預報 + 卡比小語 外框（左右排版） */
        .forecast-wrapper {
            display: flex;
            gap: 16px;
            align-items: stretch;   /* ⭐ 撐滿兩邊高度 */
            margin: 6px 6px 8px;   /* 不再有額外的 margin-top，卡片就會在同一高度 */
        }

        /* 左邊卡片區 */
        .forecast-left {
            flex: 1;
            min-width: 0;
        }

        /* 卡比小語：預設桌機隱藏，只在手機版打開 */
        .kirby-quote-label {
            display: none;                 /* 桌機不顯示，手機在 media query 裡打開 */
            font-size: 1.1rem;             /* 和 .section-title 一樣 */
            font-weight: 900;
            color: var(--pk-text-main);
            display: none;
            align-items: center;
            gap: 6px;                      /* 和 .section-title 一樣 */
            margin-bottom: 6px;            /* 標題和下面卡片的距離 */
        }

        /* 前面加蛋糕 icon，和上面 header 的卡比小語一致 */
        .kirby-quote-label::before {
            content: "🍰";
        }

        /* 文字本體 */
        .kirby-quote-text {
            font-size: 0.9rem;
            color: #54324a;
            font-weight: 700;
            line-height: 1.5;
        }

        .kirby-quote-tip {
            font-size: 0.8rem;
            color: #9b6b82;
            margin-top: 4px;
            line-height: 1.4;
        }

        .kirby-column {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: stretch;   /* ⭐ 讓卡片可以撐滿 */
        }

        .kirby-quote-card {
            flex: 1;                /* ⭐ 右側卡片吃滿高度（桌機） */
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 14px 16px 12px;
            border: 1px solid rgba(233, 222, 206, 0.9);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            margin-top: 0;
        }

        /* 卡比小語標題：沿用 section-title，但不往左縮 */
        .kirby-section-title {
            margin-left: 0;   /* 切齊卡片左邊 */
        }

        /* 文字區 */
        .kirby-quote-text {
            font-size: 0.9rem;
            color: #54324a;
            font-weight: 700;
            line-height: 1.5;
        }

        .kirby-quote-tip {
            font-size: 0.8rem;
            color: #9b6b82;
            margin-top: 4px;
            line-height: 1.4;
        }

        /* 小螢幕：改成上下排 */
        @media (max-width: 680px) {
            .forecast-wrapper {
                flex-direction: column;   /* 上下排 */
                align-items: stretch;     /* 兩塊都撐滿寬度 */
            }

            /* 卡比小語卡片在手機版回到自然高度 */
            .kirby-quote-card {
                flex: none;               /* 覆蓋桌機版的 flex:1 */
            }

            .forecast-left,
            .kirby-column {
                flex: none;
                width: 100%;              /* 每個區塊各占一整行 */
            }

            .kirby-column {
                margin-top: 12px;         /* 和上面天氣卡片留一點距離 */
            }

            /* ✅ 手機版顯示卡比小語標籤（在卡片上方） */
            .kirby-quote-label {
                display: inline-flex;
            }

            /* ✅ 手機版隱藏上面 header 裡「卡比小語」那一欄，只留左邊標題 */
            .forecast-header-row .forecast-header-col:last-child {
                display: none;
            }
        }


        /* Loading 畫面 */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 0, #ffffff 0, rgba(255, 255, 255, 0) 55%),
                linear-gradient(to bottom, var(--pk-sky-soft), #f4efe3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .loading-icon {
            font-size: 3.5rem;
            animation: loading-bob 1.8s infinite ease-in-out;
        }

        @keyframes loading-bob {
            0%, 100% {
                transform: translateY(0) rotate(-4deg);
            }
            50% {
                transform: translateY(-10px) rotate(4deg);
            }
        }

        .loading-text {
            color: var(--pk-text-main);
            font-weight: bold;
            margin-top: 16px;
            font-size: 0.95rem;
            text-align: center;
        }

        .loading-sub {
            margin-top: 4px;
            font-size: 0.8rem;
            color: var(--pk-text-soft);
        }
    </style>
</head>

<body>
    <div id="loading" class="loading-screen">
        <div class="loading-icon">⭐️</div>
        <p class="loading-text">卡比正在幫你試吃今天的天氣…</p>
        <p class="loading-sub">等他吃完一輪蛋糕，就會回報體感溫度與穿搭建議！</p>
    </div>

    <div class="status-bar">
        <div class="location-pill" id="locationPill">📍 讀取中...</div>
        <div id="updateTime" class="update-pill">更新中...</div>
    </div>

    <div class="container" id="mainContent" style="display: none;">

        <!-- 地區選擇區塊 -->
        <div style="margin-bottom: 15px; display:flex; gap:8px; align-items:center;">
            <select id="citySelect"
                style="flex:1; padding:8px 12px; border-radius:999px; border:none; font-family:inherit; font-weight:700; font-size:0.9rem; box-shadow:0 0 0 2px rgba(255,255,255,0.9), 0 3px 6px rgba(0,0,0,0.08); background:rgba(255,255,255,0.95);">
            </select>
            <button id="autoLocateBtn"
                style="white-space:nowrap; border:none; border-radius:999px; padding:8px 12px; background:linear-gradient(135deg,#ffe066,#ffc857); font-weight:700; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,0.18);">
                📡 偵測目前位置
            </button>
        </div>

        <div id="heroCard"></div>

        <!-- 上方：左右標題（左：接下來的天氣預報／右：卡比小語） -->
        <div class="forecast-header-row">
            <div class="forecast-header-col">
                <h3 class="section-title">接下來的天氣預報</h3>
            </div>
            <div class="forecast-header-col">
                <!-- 加 kirby-title 只是換 icon，樣式沿用 section-title -->
                <h3 class="section-title kirby-title">卡比小語</h3>
            </div>
        </div>


        <!-- 下方：預報卡片 + 卡比小語 -->
        <div class="forecast-wrapper">
            <!-- 左邊：預報卡片 -->
            <div class="forecast-left">
                <div class="scroll-container" id="futureForecasts"></div>
            </div>

            <!-- 右邊：卡比小語（標題 + 卡片） -->
            <div class="kirby-column">
                <div class="kirby-quote-label">卡比小語</div>
                <div class="kirby-quote-card">
                    <div id="kirbyQuoteText" class="kirby-quote-text"></div>
                    <div id="kirbyQuoteTip" class="kirby-quote-tip"></div>
                </div>
            </div>
</div>

    </div>

    <script>
    // 後端新版 API：不再帶 /kaohsiung，而是 /api/weather
    const API_BASE = "https://cwaweather-backend.onrender.com";

    // 前端縣市列表（要跟後端 / CWA 的 locationName 一樣）
    const CITIES = [
        { locationName: "臺北市", label: "臺北", lat: 25.04, lng: 121.56 },
        { locationName: "新北市", label: "新北", lat: 25.01, lng: 121.46 },
        { locationName: "基隆市", label: "基隆", lat: 25.13, lng: 121.74 },
        { locationName: "桃園市", label: "桃園", lat: 24.99, lng: 121.31 },
        { locationName: "新竹市", label: "新竹市", lat: 24.81, lng: 120.97 },
        { locationName: "新竹縣", label: "新竹縣", lat: 24.84, lng: 121.0 },
        { locationName: "苗栗縣", label: "苗栗", lat: 24.56, lng: 120.82 },
        { locationName: "臺中市", label: "臺中", lat: 24.15, lng: 120.68 },
        { locationName: "彰化縣", label: "彰化", lat: 24.07, lng: 120.54 },
        { locationName: "南投縣", label: "南投", lat: 23.91, lng: 120.68 },
        { locationName: "雲林縣", label: "雲林", lat: 23.71, lng: 120.54 },
        { locationName: "嘉義市", label: "嘉義市", lat: 23.48, lng: 120.44 },
        { locationName: "嘉義縣", label: "嘉義縣", lat: 23.45, lng: 120.25 },
        { locationName: "臺南市", label: "臺南", lat: 22.99, lng: 120.21 },
        { locationName: "高雄市", label: "高雄", lat: 22.63, lng: 120.3 },
        { locationName: "屏東縣", label: "屏東", lat: 22.68, lng: 120.48 },
        { locationName: "宜蘭縣", label: "宜蘭", lat: 24.76, lng: 121.75 },
        { locationName: "花蓮縣", label: "花蓮", lat: 23.99, lng: 121.6 },
        { locationName: "臺東縣", label: "臺東", lat: 22.75, lng: 121.15 },
        { locationName: "澎湖縣", label: "澎湖", lat: 23.57, lng: 119.57 },
        { locationName: "金門縣", label: "金門", lat: 24.44, lng: 118.32 },
        { locationName: "連江縣", label: "馬祖", lat: 26.16, lng: 119.95 },
    ];

    const WADDLE_ICONS = ["🐵", "🙈", "🙉", "🙊", "🐒"];

    function getWeatherIcon(weather) {
        if (!weather) return "🌤️";
        if (weather.includes("晴")) return "☀️";
        if (weather.includes("多雲")) return "⛅";
        if (weather.includes("陰")) return "☁️";
        if (weather.includes("雨")) return "🌧️";
        if (weather.includes("雷")) return "⛈️";
        return "🌤️";
    }

    // 體感溫度 + 穿搭 AI 建議
    function getAdvice(rainProb, maxTemp, comfort) {
        const rain = parseInt(rainProb, 10) || 0;
        const t = parseInt(maxTemp, 10) || 0;

        let rainIcon = "🌂";
        let rainText = "不用帶傘";
        if (rain >= 40) {
            rainIcon = "☂️";
            rainText = "降雨機率不低，建議帶傘";
        }
        if (rain >= 70) {
            rainIcon = "🌧️";
            rainText = "高機率會下雨，雨具必備";
        }

        let clothIcon = "👕";
        let clothText = "舒適穿搭";
        let feelLabel = "舒適";
        let feelDesc = "溫度落在卡比覺得 OK 的範圍。";
        let clothDetail = "輕薄上衣 + 長褲即可，視個人冷熱微調。";
        let tip = "";

        if (t >= 32) {
            feelLabel = "悶熱";
            feelDesc = "接近盛夏中午，行動時容易流汗。";
            clothIcon = "🩳";
            clothText = "清涼裝備";
            clothDetail = "短袖 / 無袖上衣 + 短褲，搭配透氣襪與運動鞋，戶外記得防曬。";
            tip = "盡量待在陰影處，多補充水分，長時間外出可準備防曬乳與帽子。";
        } else if (t >= 28) {
            feelLabel = "微熱";
            feelDesc = "走動一陣子會覺得有點熱，但微風還算舒適。";
            clothIcon = "🎽";
            clothText = "短袖出發";
            clothDetail = "短袖上衣 + 薄長褲或短褲都可以，通風的材質最好。";
        } else if (t <= 20 && t > 16) {
            feelLabel = "微涼";
            feelDesc = "靜止時會有點涼，走動後就剛剛好。";
            clothIcon = "🧥";
            clothText = "薄外套模式";
            clothDetail = "長袖上衣 + 薄外套或襯衫，配長褲；怕冷可以多加一層。";
        } else if (t <= 16) {
            feelLabel = "偏冷";
            feelDesc = "對卡比來說算是冷的天氣。";
            clothIcon = "🧣";
            clothText = "保暖出勤";
            clothDetail = "厚外套 + 長袖上衣 + 長褲，必要時加圍巾、毛帽與保暖襪。";
            tip = "早晚溫差可能偏大，建議分層穿搭，方便調整。";
        }

        if (comfort && typeof comfort === "string") {
            if (comfort.includes("悶熱")) {
                feelLabel = "悶熱";
                feelDesc = "官方描述為「" + comfort + "」，建議減少厚重衣物。";
            } else if (comfort.includes("舒適")) {
                feelLabel = "舒適";
                feelDesc = "官方描述為「" + comfort + "」，適合一般日常活動。";
            } else if (comfort.includes("稍涼") || comfort.includes("偏冷")) {
                feelLabel = "偏涼";
                feelDesc = "官方描述為「" + comfort + "」，建議多帶一件外套。";
            }
        }

        return {
            rainIcon,
            rainText,
            clothIcon,
            clothText,
            feelLabel,
            feelDesc,
            clothDetail,
            tip,
        };
    }

    // 今日應援小隊（卡比版）
    function getKirbySquad(current) {
        const rain = parseInt(current.rain, 10) || 0;
        const t = parseInt(current.maxTemp, 10) || 0;
        const desc = current.weather || "";
        const squad = [];

        // 永遠都會出現的卡比 + 瓦豆魯迪（隨機表情）
        squad.push({ icon: "🌸", label: "卡比本尊", role: "負責試吃今天的天氣" });

        const randomIcon =
            WADDLE_ICONS[Math.floor(Math.random() * WADDLE_ICONS.length)];
        squad.push({
            icon: randomIcon,
            label: "瓦豆魯迪應援團",
            role: "負責在旁邊加油",
        });

        // 🔥 熱：清爽系列（冰品卡比）
        if (t >= 28 || (t >= 26 && desc.includes("晴"))) {
            squad.push({ icon: "🍦", label: "冰品卡比", role: "負責降溫與涼爽行動" });
        }

        // ☔ 雨：雨天小隊
        if (rain >= 40 || desc.includes("雨")) {
            squad.push({ icon: "🌂", label: "雨具卡比", role: "專門提醒帶傘" });
        }

        // ⚡ 雷陣雨：電氣系
        if (desc.includes("雷") || desc.includes("雷陣雨")) {
            squad.push({ icon: "⚡️", label: "電電卡比", role: "偵測打雷與安全提醒" });
        }

        // 🧥 微冷：保暖
        if (t <= 18) {
            squad.push({ icon: "🧣", label: "暖暖卡比", role: "負責圍巾與外套建議" });
        }

        // 🛏 很冷：睡衣
        if (t <= 14) {
            squad.push({ icon: "🛏️", label: "睡衣卡比", role: "提醒你多穿一點再出門" });
        }

        return squad;
    }

    // 卡比小語語錄（可以之後自己增減或改文案）
    const KIRBY_QUOTES = [
        { text: "今天的天氣看起來…適合再吃一片蛋糕。", tip: "記得幫自己留一點喜歡的行程，心情也會放晴。" },
        { text: "就算雲多一點，卡比也照樣滾來滾去。", tip: "帶點餘裕出門，遇到小插曲也能可愛帶過。" },
        { text: "氣溫有點涼？那就多一層蓬鬆的幸福。", tip: "薄外套或帽 T 是今日的安全感來源。" },
        { text: "如果不知道要穿什麼，就先挑讓自己開心的顏色。", tip: "心情是今天最重要的穿搭配件。" },
        { text: "天氣好壞，不能決定卡比吃幾塊蛋糕。", tip: "把行程排得鬆一點，給自己保留喘口氣的空間。" },
        { text: "風吹過來的時候，就當是在幫卡比降溫。", tip: "風比較大時，記得收好帽子和紙張，小物件容易飛走。" },
        { text: "陰天其實很適合散步，不會曬到變烤卡比。", tip: "溫度舒適時，多走幾步，身體也會更清醒。" },
        { text: "雨天也沒關係，有雨聲陪你慢慢前進。", tip: "帶傘、穿好鞋，雨天一樣可以是可愛的日子。" },
        { text: "冷一點的日子，更適合抱著熱飲發呆。", tip: "手邊準備一杯溫熱的飲料，從手開始暖起來。" },
        { text: "太熱的話，就把自己當成需要冷藏的蛋糕。", tip: "少待太久的太陽底下，多躲進室內或陰影裡。"},
        { text: "今天的雲看起來，像是卡比咬過的棉花糖。", tip: "抬頭看一下天空，說不定會發現很好玩的形狀。" },
        { text: "不管幾度，只要出門前深呼吸三次，今天就會好一點。", tip: "給自己 10 秒鐘，讓心情跟身體一起醒來。" },
        { text: "風把頭髮吹亂沒關係，把心情梳順一點就好。", tip: "帶頂帽子或髮圈，會輕鬆很多。" },
        { text: "如果猶豫要不要帶外套，那就帶吧。", tip: "外套可以不穿，但忘記帶就真的沒得選。" },
        { text: "雖然天氣預報會變，但你可以一直很可愛。", tip: "行程留點彈性，變動來了也不容易慌。" },
        { text: "今天不一定要很努力，但可以對自己溫柔一點。", tip: "把待辦分成『一定要』和『可以晚點』，減少壓力。" },
        { text: "有時候陰天，只是在幫你省防曬乳。", tip: "不想曬黑還是可以薄擦一層，未來的自己會感謝你。" },
        { text: "感覺累的時候，就把自己當成需要充電的卡比。", tip: "中午或下午安排一個 5 分鐘的小休息，效果常常超過預期。" },
        { text: "天氣普通的日子，反而最適合默默前進。", tip: "沒有特別的事，也是一種安穩的幸福。" },
        { text: "如果早上出門很趕，就讓卡比幫你說：今天這樣就很好了。", tip: "不用追求完美出門，只要有到就很棒。"},
        // 你可以再補到 50 句，先給你 20 句示範
    ];

    let currentQuoteIndex = -1;
    window._kirbyQuoteTimer = null;

        function pickRandomQuote() {
        if (!KIRBY_QUOTES.length) return null;

        let idx;
        do {
            idx = Math.floor(Math.random() * KIRBY_QUOTES.length);
        } while (KIRBY_QUOTES.length > 1 && idx === currentQuoteIndex);

        currentQuoteIndex = idx;
        return KIRBY_QUOTES[idx];
    }

    function initQuoteRotation() {
        const textEl = document.getElementById("kirbyQuoteText");
        const tipEl = document.getElementById("kirbyQuoteTip");
        if (!textEl || !tipEl) return;   // 保險：DOM 還沒畫好就不要動

        const applyQuote = () => {
            const q = pickRandomQuote();
            if (!q) return;
            textEl.textContent = q.text;
            tipEl.textContent = q.tip;
        };

        // 先馬上更新一次
        applyQuote();

        // 如果之前有 timer，先清掉，避免重複 setInterval
        if (window._kirbyQuoteTimer) {
            clearInterval(window._kirbyQuoteTimer);
        }

    }

    function getTimePeriod(startTime) {
        const hour = new Date(startTime).getHours();
        if (hour >= 5 && hour < 11) return "早晨";
        if (hour >= 11 && hour < 14) return "中午";
        if (hour >= 14 && hour < 18) return "下午";
        if (hour >= 18 && hour < 23) return "晚上";
        return "深夜";
    }

    function updateLocationPill(locationName) {
        const pill = document.getElementById("locationPill");
        if (!pill || !locationName) return;
        const short = locationName.replace(/[市縣]$/, "");
        pill.textContent = `📍 ${short}`;
    }

    function renderWeather(data) {
        const forecasts = data.forecasts;
        const current = forecasts[0];
        const others = forecasts.slice(1);

        const advice = getAdvice(current.rain, current.maxTemp, current.comfort);
        const squad = getKirbySquad(current);
        const period = getTimePeriod(current.startTime);
        const avgTemp = Math.round(
            (parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2
        );

        const heroHtml = `
            <div class="hero-card">
                <div class="hero-period">${period}</div>
                <div class="hero-temp-container">
                    <div class="hero-icon">${getWeatherIcon(current.weather)}</div>
                    <div class="hero-temp">${avgTemp}°</div>
                </div>
                <div class="hero-desc">${current.weather}</div>

                <div class="hero-meta-row">
                    <div class="hero-meta-chip">🌡️ ${current.minTemp}° - ${current.maxTemp}°</div>
                    <div class="hero-meta-chip">💧 降雨率 ${current.rain}</div>
                    ${current.comfort ? `<div class="hero-meta-chip">🙂 ${current.comfort}</div>` : ""}
                </div>
                
                <div class="advice-grid">
                    <div class="advice-item">
                        <div class="advice-icon">${advice.rainIcon}</div>
                        <div class="advice-text">${advice.rainText}</div>
                        <div class="advice-sub">降雨率 ${current.rain}</div>
                    </div>
                    <div class="advice-item">
                        <div class="advice-icon">${advice.clothIcon}</div>
                        <div class="advice-text">${advice.clothText}</div>
                        <div class="advice-sub">最高溫 ${current.maxTemp}°</div>
                    </div>
                </div>

                <div class="ai-advice-card">
                    <div class="ai-advice-title">體感溫度 & 穿搭 AI 模式</div>
                    <div class="ai-advice-feel">🌡️ 體感：${advice.feelLabel}</div>
                    <div class="ai-advice-detail">${advice.feelDesc}</div>
                    <div class="ai-advice-outfit">${advice.clothDetail}</div>
                    ${advice.tip ? `<div class="ai-advice-tip">${advice.tip}</div>` : ""}
                </div>

                <!-- 今日出勤小隊 -->
                <div class="squad-card">
                    <div class="squad-title">今日應援小隊</div>
                    <div class="squad-row">
                        ${squad
                            .map(
                                (m) => `
                                <div class="squad-chip">
                                    <span class="squad-chip-icon">${m.icon}</span>
                                    <div class="squad-chip-text">
                                        <div class="squad-chip-label">${m.label}</div>
                                        <div class="squad-chip-role">${m.role}</div>
                                    </div>
                                </div>
                            `
                            )
                            .join("")}
                    </div>
                </div>
            </div>
        `;

        document.getElementById("heroCard").innerHTML = heroHtml;

        // ======== 底下是原本的「稍後預報」 ========
        const scrollContainer = document.getElementById("futureForecasts");
        scrollContainer.innerHTML = "";

        const todayDate = new Date().getDate();

        others.forEach((f) => {
            let p = getTimePeriod(f.startTime);
            const fDate = new Date(f.startTime);
            if (fDate.getDate() !== todayDate) {
                p = "明天" + p;
            }

            scrollContainer.innerHTML += `
                <div class="mini-card">
                    <div class="mini-time">${p}</div>
                    <div class="mini-icon">${getWeatherIcon(f.weather)}</div>
                    <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
                    <div class="mini-extra">💧 ${f.rain}</div>
                </div>
            `;
        });

        const now = new Date();
        const month = now.getMonth() + 1;
        const date = now.getDate();
        const dayIndex = now.getDay();
        const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

        document.getElementById("updateTime").textContent = `${month}月${date}日 ${days[dayIndex]}`;

        // 這裡新增：每次更新天氣時，也更新一次小語
        initQuoteRotation();
    }

    // 依照 locationName 呼叫後端
    async function fetchWeatherByLocationName(locationName) {
        try {
            const delayPromise = new Promise((resolve) => setTimeout(resolve, 1500));

            const url = locationName
                ? `${API_BASE}?locationName=${encodeURIComponent(locationName)}`
                : API_BASE;

            const fetchPromise = fetch(url).then((res) => res.json());

            const [_, json] = await Promise.all([delayPromise, fetchPromise]);

            if (json.success) {
                renderWeather(json.data);
                updateLocationPill(json.data.city);

                const selectEl = document.getElementById("citySelect");
                if (selectEl && json.data.city) {
                    selectEl.value = json.data.city;
                }

                document.getElementById("loading").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
            } else {
                throw new Error("API Error");
            }
        } catch (e) {
            console.error(e);
            alert("天氣資料讀取失敗，卡比吃蛋糕吃到忘記回報了！");
        }
    }

    // 前端用經緯度找最近縣市（給「📡 自動偵測」按鈕用）
    function findNearestCity(lat, lng) {
        let best = CITIES[0];
        let minDist = Infinity;

        CITIES.forEach((city) => {
            const dLat = lat - city.lat;
            const dLng = lng - city.lng;
            const dist = dLat * dLat + dLng * dLng;
            if (dist < minDist) {
                minDist = dist;
                best = city;
            }
        });

        return best;
    }

    function initApp() {
        const selectEl = document.getElementById("citySelect");
        const autoBtn = document.getElementById("autoLocateBtn");

        // 1. 塞入縣市選單
        CITIES.forEach((city) => {
            const option = document.createElement("option");
            option.value = city.locationName;
            option.textContent = city.label;
            selectEl.appendChild(option);
        });

        // 2. 選單切換 → 依縣市抓天氣
        selectEl.addEventListener("change", () => {
            document.getElementById("loading").style.display = "flex";
            document.getElementById("mainContent").style.display = "none";
            fetchWeatherByLocationName(selectEl.value);
        });

        // 3. 「📡 自動偵測」按鈕：用瀏覽器定位 → 找最近縣市 → 呼叫 API
        autoBtn.addEventListener("click", () => {
            if (!navigator.geolocation) {
                alert("此瀏覽器不支援定位功能，改用 IP 自動定位。");
                document.getElementById("loading").style.display = "flex";
                document.getElementById("mainContent").style.display = "none";
                fetchWeatherByLocationName();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude } = pos.coords;
                    const nearest = findNearestCity(latitude, longitude);

                    selectEl.value = nearest.locationName;
                    document.getElementById("loading").style.display = "flex";
                    document.getElementById("mainContent").style.display = "none";
                    fetchWeatherByLocationName(nearest.locationName);
                },
                (err) => {
                    console.error(err);
                    alert("定位失敗，改用 IP 自動定位。");
                    document.getElementById("loading").style.display = "flex";
                    document.getElementById("mainContent").style.display = "none";
                    fetchWeatherByLocationName();
                }
            );
        });

        // 4. 頁面首次載入：不帶參數，讓後端「預設自動定位」
        fetchWeatherByLocationName();
    }

    document.addEventListener("DOMContentLoaded", initApp);
</script>
